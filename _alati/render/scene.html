<!doctype html><html><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const q=new URLSearchParams(location.search);
const W=+q.get('w')||2400,H=+q.get('h')||1500,shot=q.get('shot')||'hero';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;

// studio za odsjaje: tamna soba + dugacki softboxovi (daju trake svetla na staklu)
const envS=new THREE.Scene();envS.background=new THREE.Color(0x0a2a6b);
function panel(w,h,x,y,z,col,i){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(i),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);envS.add(m)}
panel(30,3,0,16,6,0xffffff,14);panel(3,22,-20,2,10,0xe6f4ff,9);panel(4,22,22,0,6,0xbfe4ff,6);panel(30,5,0,-14,8,0x7fb6ff,3);panel(14,10,4,4,24,0xffffff,2.2);panel(10,6,-8,-6,-20,0xffb37a,5);
const pm=new THREE.PMREMGenerator(r);const env=pm.fromScene(envS,0.012).texture;
const scene=new THREE.Scene();scene.environment=env;

// pozadina: hladna zapremina vazduha u BEIL plavoj
const bgc=document.createElement('canvas');bgc.width=1024;bgc.height=640;const g=bgc.getContext('2d');
const PET=q.get('pal')==='petrol';g.fillStyle=PET?'#10252b':'#0b2f86';g.fillRect(0,0,1024,640);
function blob(x,y,rad,c){const a=g.createRadialGradient(x,y,0,x,y,rad);a.addColorStop(0,c);a.addColorStop(1,c.replace(/[\d.]+\)$/,'0)'));g.fillStyle=a;g.fillRect(0,0,1024,640)}
if(PET){blob(700,140,560,'rgba(40,104,118,0.95)');blob(930,30,300,'rgba(150,196,200,0.7)');blob(100,620,560,'rgba(8,18,22,0.95)');blob(520,660,340,'rgba(26,62,70,0.8)')}else{blob(760,150,520,'rgba(120,205,255,0.95)');blob(960,40,300,'rgba(235,250,255,0.95)');blob(120,620,560,'rgba(6,20,84,0.95)');blob(520,650,380,'rgba(40,110,240,0.8)');blob(90,60,380,'rgba(16,62,170,0.9)')}
const bg=new THREE.CanvasTexture(bgc);bg.colorSpace=THREE.SRGBColorSpace;scene.background=bg;

const glass=new THREE.MeshPhysicalMaterial({color:0xf2faff,transmission:1,roughness:0.035,metalness:0,ior:1.46,thickness:0.55,attenuationColor:new THREE.Color(0xbfe6ff),attenuationDistance:3.2,clearcoat:1,clearcoatRoughness:0.03,specularIntensity:1,envMapIntensity:1.35,side:THREE.FrontSide});
const glassThin=glass.clone();glassThin.thickness=0.18;glassThin.attenuationDistance=1.6;
const copper=new THREE.MeshStandardMaterial({color:0xd98a4e,metalness:1,roughness:0.24,envMapIntensity:1.6});
const fin=new THREE.MeshStandardMaterial({color:0xdfe9f3,metalness:1,roughness:0.34,envMapIntensity:1.1});
const white=new THREE.MeshPhysicalMaterial({color:0xf5f9fc,roughness:0.42,clearcoat:.5,envMapIntensity:.9});

const ac=new THREE.Group();scene.add(ac);
const L=7.4,HH=1.95,D=1.55;
// oklop
const shell=new THREE.Mesh(new RoundedBoxGeometry(L,HH,D,10,0.42),glass);ac.add(shell);
// lamele izmenjivaca
const finN=170,finG=new THREE.BoxGeometry(0.018,1.02,0.56);
const fins=new THREE.InstancedMesh(finG,fin,finN);const M=new THREE.Matrix4();
for(let i=0;i<finN;i++){M.identity();M.setPosition(-L/2+0.72+i*(L-1.44)/(finN-1),0.14,0.02);fins.setMatrixAt(i,M)}ac.add(fins);
// bakarne cevi: horizontalni prolazi + U-krivine na krajevima
const rows=[[0.5,0.36],[0.25,0.36],[0.0,0.36],[-0.25,0.36]];
function pipe(pts,rad){const c=new THREE.CatmullRomCurve3(pts);return new THREE.Mesh(new THREE.TubeGeometry(c,220,rad,16,false),copper)}
rows.forEach(([y,z],k)=>{
  const xa=-L/2+0.58,xb=L/2-0.58;
  ac.add(new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.052,xb-xa,18).rotateZ(Math.PI/2).translate(0,y,z),copper));
  if(k<rows.length-1){const [y2,z2]=rows[k+1];const side=k%2?xa:xb,s=k%2?-1:1;
    ac.add(pipe([new THREE.Vector3(side,y,z),new THREE.Vector3(side+s*0.13,y-0.04,z-.01),new THREE.Vector3(side+s*0.17,(y+y2)/2,(z+z2)/2),new THREE.Vector3(side+s*0.13,y2+0.04,z2+.01),new THREE.Vector3(side,y2,z2)],0.05))}
});
// dovodne cevi koje izlaze iz jedinice
ac.add(pipe([new THREE.Vector3(L/2-0.58,0.5,0.36),new THREE.Vector3(L/2-0.2,0.54,0.1),new THREE.Vector3(L/2+0.5,0.42,-0.35),new THREE.Vector3(L/2+1.55,-0.15,-0.85),new THREE.Vector3(L/2+2.7,-1.5,-1.3),new THREE.Vector3(L/2+3.6,-3.7,-1.5)],0.075));
ac.add(pipe([new THREE.Vector3(-L/2+0.58,-0.25,0.36),new THREE.Vector3(-L/2+0.2,-0.22,-0.45),new THREE.Vector3(0,-0.1,-0.62),new THREE.Vector3(L/2-.1,-0.32,-0.56),new THREE.Vector3(L/2+1.2,-0.8,-1.05),new THREE.Vector3(L/2+2.4,-2,-1.5),new THREE.Vector3(L/2+3.15,-3.8,-1.7)],0.055));
// tangencijalni ventilator
const fan=new THREE.Group();fan.position.set(0,-0.6,0.02);ac.add(fan);
const bladeN=56,bl=new THREE.BoxGeometry(L-1.7,0.012,0.095);const blades=new THREE.InstancedMesh(bl,white,bladeN);const O=new THREE.Object3D();
for(let i=0;i<bladeN;i++){const a=i/bladeN*Math.PI*2;O.position.set(0,Math.cos(a)*0.27,Math.sin(a)*0.27);O.rotation.set(a+0.7,0,0);O.updateMatrix();blades.setMatrixAt(i,O.matrix)}fan.add(blades);
for(let i=0;i<9;i++){const d=new THREE.Mesh(new THREE.CylinderGeometry(0.29,0.29,0.016,48).rotateZ(Math.PI/2),white);d.position.x=-(L-1.7)/2+i*(L-1.7)/8;fan.add(d)}
// usmerivac vazduha (krilo)
function wing(y,z,rx,w=L-0.7,c=0.26,mat=glassThin){const m=new THREE.Mesh(new RoundedBoxGeometry(w,0.045,c,6,0.02),mat);m.position.set(0,y,z);m.rotation.x=rx;ac.add(m);return m}

// hladan vazduh: staklene trake koje teku iz jedinice
const ribbonMat=glassThin.clone();ribbonMat.color=new THREE.Color(0xe8f7ff);ribbonMat.roughness=.02;
function sheet(x0,w,sp,dx,drop,depth,N=90,U=26){
  const pos=[],idx=[];
  for(let i=0;i<=N;i++){const t=i/N;
    for(let j=0;j<=U;j++){const u=j/U-.5;
      const taper=(1-.55*t)*Math.sin(Math.min(1,(j/U)*1)*Math.PI)**.22;
      const x=x0+dx*t+u*w*(1+t*.9)*taper+Math.sin(t*4.2+sp)*.38*t;
      const y=-.98-drop*t*t-.25*t+Math.sin(u*5+t*7+sp)*.17*t;
      const z=.8+depth*t+Math.cos(u*6+t*6+sp)*.24*t;
      pos.push(x,y,z)}}
  for(let i=0;i<N;i++)for(let j=0;j<U;j++){const a=i*(U+1)+j,b=a+1,c=a+U+1,d=c+1;idx.push(a,c,b,b,c,d)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=glassThin.clone();m.side=THREE.DoubleSide;m.thickness=.32;m.ior=1.5;m.roughness=.02;m.attenuationColor=new THREE.Color(0xd6f1ff);m.attenuationDistance=1.1;
  ac.add(new THREE.Mesh(g,m));
}



// svetla za metale
const k=new THREE.DirectionalLight(0xffffff,2.3);k.position.set(3,6,7);scene.add(k);
const rim=new THREE.DirectionalLight(0xffc49a,1.5);rim.position.set(-6,-2,-3);scene.add(rim);

const cam=new THREE.PerspectiveCamera(26,W/H,.1,200);
if(shot==='hero'){ac.rotation.set(0.1,-0.4,0.02);ac.position.set(2.15,1.15,0);cam.position.set(0,0,19.5);cam.lookAt(0,0,0)}
if(shot==='macro'){ac.rotation.set(0.2,-0.7,0.03);ac.position.set(0,0,0);cam.fov=20;cam.updateProjectionMatrix();cam.position.set(-1.9,0.55,9.4);cam.lookAt(-1.5,-0.05,0)}
if(shot==='ph'){ac.rotation.set(0.14,-0.42,0.02);ac.position.set(0.1,0.1,0);cam.position.set(0,0,19);cam.lookAt(0,0,0)}if(shot==='tall'){ac.rotation.set(0.14,-0.46,0.02);ac.position.set(-0.45,4.2,0);cam.fov=32;cam.updateProjectionMatrix();cam.position.set(0,0,23);cam.lookAt(0,0,0)}
r.render(scene,cam);r.render(scene,cam);
window.DONE=true;
</script></body></html>
